        var eid = '';
        try {
          eid = new URLSearchParams(window.location.search).get('eid') || '';
        } catch (e) { /* URL malformada */ }
        if (!eid) {
          try {
            var ld = JSON.parse(localStorage.getItem('ld') || '{}');
            eid = ld.eid || '';
          } catch (e) { /* modo privado ou payload invalido */ }
        }
        if (eid) {
          fbq('track', 'Lead', {}, { eventID: eid });
        } else {
          fbq('track', 'Lead');
        }
      })();
    </script>
