    <!-- Captura do link pessoal: PRIMEIRO script da página, antes do consentimento,
         do Pixel e do gtag. Lê #t=<token>, guarda na sessionStorage e apaga o
         fragmento da URL, para que PageView e page_location nunca o carreguem.
         O token é opaco: só se confere o formato. docs/specs/pages/agendar.md §4 -->
    <script>
        (function () {
            var re = /^[A-Za-z0-9_.-]{20,200}$/;
            var h = location.hash;
            if (!h) return;
            var m = /^#t=([^&]*)/.exec(h);
            var t = m && re.test(m[1]) ? m[1] : null;
            try {
                if (t) sessionStorage.setItem("be_agendar_t", t);
                else sessionStorage.removeItem("be_agendar_t");
            } catch (e) {
                window.__be_agendar_t = t; // sessionStorage bloqueada: vale só nesta carga
            }
            history.replaceState(null, "", location.pathname + location.search);
        })();
    </script>

    <!-- Consent Mode v2 (padrão negado) — precede Pixel e GA4 de propósito: um
         módulo é adiado e chegaria tarde. Interface em /js/cookie-consent.js;
         contrato em docs/specs/design/cookie-consent.md -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        (function () {
            var cat = null;
            try {
                var raw = JSON.parse(localStorage.getItem("be_consent") || "null");
                if (raw && raw.v === 1) cat = raw.cat;
            } catch (e) { /* modo privado: trata como quem ainda não decidiu */ }
            window.__ccMarketing = !!(cat && cat.marketing);
            gtag("consent", "default", {
                ad_storage: "denied", ad_user_data: "denied", ad_personalization: "denied",
                analytics_storage: "denied", functionality_storage: "granted",
                security_storage: "granted", wait_for_update: 500
            });
            if (cat) {
                var s = function (on) { return on ? "granted" : "denied"; };
                gtag("consent", "update", {
                    ad_storage: s(cat.marketing), ad_user_data: s(cat.marketing),
                    ad_personalization: s(cat.marketing), analytics_storage: s(cat.analytics)
                });
            }
        })();
    </script>
